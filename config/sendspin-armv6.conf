# Sendspin ARMv6 configuration
# See README.md for details.

# Required: WebSocket URL of your Sendspin server.
# Find the IP of the machine running the Sendspin server and set it here.
# The default port is 8927 and path is /sendspin.
server_url = ws://192.168.1.10:8927/sendspin

# Optional: Friendly name shown in the Sendspin UI.
name = Pi Zero Player

# Optional: Log level (none, error, warn, info, debug, verbose).
log_level = info

# ALSA device for audio output.
# The Pi Zero W has no built-in 3.5mm jack — you need an external USB soundcard.
# Find available devices with: aplay -l
# Then set the device to the matching card/device number, e.g.:
#   plughw:1,0   (USB soundcard, card 1, device 0)
#   plughw:CARD=Device,DEV=0   (by card name)
# Leave commented out to use the system default device.
device = plughw:0,0

# Optional: ALSA mixer element for hardware volume control.
# If set, volume changes are sent directly to the ALSA mixer (e.g. "Headphone",
# "Speaker", "PCM").  The mixer element must exist on the configured device.
# Leave commented out to use the default software volume control.
#mixer = Headphone

# Optional: Startup volume (0–100).
# Sets the hardware volume at power-up, before the server issues its first
# VOLUME command.  Useful for devices where the ALSA default is too loud or
# too quiet.  The server may override this once a connection is established.
# Leave commented out to let the server control volume from the start.
#initial_volume = 80

# Optional: Initial static playback delay in milliseconds (0–5000).
# Adds a fixed delay before playback starts, which can help keep multiple
# players in sync across the network.  The server may adjust this at runtime.
# Leave commented out for no initial static delay.
#initial_static_delay = 200

# Optional: Idle timeout in seconds before releasing the audio device.
# This allows other applications to use the audio hardware when Sendspin is idle.
# 0 = disabled (device stays open permanently).
#idle_timeout = 60

# Optional: Now-playing OLED display (see README "OLED display").
# Shows title, artist, album, stream format, progress and volume on a small I2C OLED.
# Disabled by default; set to ssd1306 (0.96" panels) or sh1106 (1.3" panels)
# to enable.  Leave as none if no display is connected.
#display = none
# I2C bus number (/dev/i2c-1 on the Pi's GPIO header).
#display_i2c_bus = 1
# I2C address in hex, as shown by: i2cdetect -y 1  (usually 3c, sometimes 3d)
#display_i2c_address = 3c
# Panel height in pixels: 64 (128x64) or 32 (128x32).
#display_height = 64
# Rotate the image 180 degrees if the panel is mounted upside down (0 or 180).
#display_rotate = 0
# Brightness (0-255).
#display_contrast = 128
# Turn the panel off after this many seconds without playback to prevent
# OLED burn-in.  It wakes up again when playback starts.  0 = never.
#display_sleep = 300
