name: Release

on:
  push:
    # This workflow should strictly run on tags to prevent releases named "main"
    tags: ["v*"]

permissions:
  contents: write

jobs:
  # Call the combined build workflow which builds both Debug and Release in parallel
  run-builds:
    uses: ./.github/workflows/build.yml

  publish:
    name: Publish GitHub Release
    needs: [run-builds]
    runs-on: ubuntu-latest
    steps:
      - name: Download release artifact
        uses: actions/download-artifact@v4
        with:
          name: sendspin-armv6-linux-armv6-release

      - name: Download debug artifact
        uses: actions/download-artifact@v4
        with:
          name: sendspin-armv6-linux-armv6-debug

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          # Automatically extracts tag name from ref
          tag_name: ${{ github.ref_name }}
          files: |
            sendspin-armv6-linux-armv6-release.tar.gz
            sendspin-armv6-linux-armv6-debug.tar.gz